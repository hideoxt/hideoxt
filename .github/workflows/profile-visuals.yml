name: Generate Profile Arcade

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-visuals.yml"

permissions:
  contents: write

jobs:
  generate:
    name: Generate Arcade Visuals
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Pac-Man and Breakout
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman,breakout"
          hide_month_labels: "false"

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#FD4456&color_dots=#EBEDF0,#875D93,#A977B1,#FFA0F0,#FD4456
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FD4456&color_dots=#161B22,#875D93,#A977B1,#FFA0F0,#FD4456

      - name: Publish arcade SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
